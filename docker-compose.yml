services:
  postgres:
    image: postgres:16-alpine
    container_name: duoc-connect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duoc_connect}
      POSTGRES_USER: ${POSTGRES_USER:-duoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duoc_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duoc} -d ${POSTGRES_DB:-duoc_connect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: duoc-connect-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-duoc_connect}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-duoc}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-duoc_secret}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production-min-32-chars}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: duoc-connect-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads_data:
