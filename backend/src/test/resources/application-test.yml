spring:
  datasource:
    url: jdbc:h2:mem:duoc_connect_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-min-32-chars
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
