spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:duoc_connect_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}

app:
  jwt:
    secret: test-secret-key-for-unit-tests-min-32-chars
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  upload:
    path: ${java.io.tmpdir}/duoc-connect-test-uploads
